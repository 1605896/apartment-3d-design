<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>3D 智能装修设计系统 - 完整版</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #eee;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: fixed;
      z-index: 5;
      left: 14px;
      top: 14px;
      width: 320px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.16);
      font-size: 12px;
      line-height: 1.5;
      color: #333;
    }
    #ui h1 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #222;
    }
    #ui h2 {
      font-size: 13px;
      margin: 14px 0 8px;
      color: #555;
      font-weight: 600;
    }
    #ui p {
      margin: 0 0 8px;
      color: #666;
    }
    .note {
      background: #f6f1e8;
      padding: 8px;
      border-radius: 8px;
      margin: 8px 0;
      font-size: 11px;
      line-height: 1.4;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 6px 0;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 11px;
      flex: 1;
      min-width: 60px;
      transition: all 0.2s;
    }
    button:hover {
      background: #444;
    }
    select {
      width: 100%;
      padding: 6px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 11px;
      margin: 4px 0;
    }
    #stats {
      background: #f9f9f9;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      margin-top: 8px;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: #f8f6f2;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #888;
      transition: opacity 0.3s;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="loading">
  <div style="text-align: center;">
    <div style="font-size: 24px; margin-bottom: 12px;">🏠</div>
    <div>正在加载 3D 场景...</div>
    <div style="font-size: 11px; margin-top: 8px; color: #aaa;">初始化材质、照明和家具</div>
  </div>
</div>

<div id="ui">
  <h1>🏠 3D 装修设计系统</h1>
  <p><b>9850 × 9450 mm</b></p>
  <div class="note" style="background: #f0f4ff;">
    <b>✨ 完整功能版：</b>实时 3D + 多场景照明 + 碰撞检测
  </div>

  <h2>📺 视角</h2>
  <div class="row">
    <button onclick="changeView('perspective')">3D</button>
    <button onclick="changeView('top')">俯视</button>
    <button onclick="changeView('living')">客厅</button>
    <button onclick="changeView('master')">主卧</button>
  </div>

  <h2>💡 照明场景</h2>
  <select onchange="changeLighting(this.value)">
    <option value="morning">☀️ 早晨阳光</option>
    <option value="noon" selected>🌞 正午阳光</option>
    <option value="evening">🌅 傍晚温光</option>
    <option value="night">🌙 夜间灯光</option>
  </select>

  <h2>🛠️ 工具</h2>
  <div class="row">
    <button onclick="saveLayout()">💾 保存</button>
    <button onclick="screenshot()">📷 截图</button>
  </div>

  <h2>📊 实时统计</h2>
  <div id="stats">
    <div>🏠 家具: <span id="stat-furniture">5</span></div>
    <div>⚠️ 碰撞: <span id="stat-collisions">0</span></div>
    <div>⚡ FPS: <span id="stat-fps">60</span></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.161/examples/js/controls/OrbitControls.js"></script>
<script>
// ========== 初始化场景 ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf8f6f2);
scene.fog = new THREE.Fog(0xf8f6f2, 14000, 30000);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 50000);
camera.position.set(11000, 9000, 11500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(4900, 0, 4700);
controls.autoRotate = false;

// ========== 材质系统 ==========
function createMaterials() {
  return {
    floor: new THREE.MeshStandardMaterial({
      color: 0xd5b98d,
      roughness: 0.55,
    }),
    wall: new THREE.MeshStandardMaterial({
      color: 0xefece4,
      roughness: 0.92,
    }),
    fabric: new THREE.MeshStandardMaterial({
      color: 0xf4f0e6,
      roughness: 0.85,
    }),
    wood: new THREE.MeshStandardMaterial({
      color: 0xc9a876,
      roughness: 0.48,
    }),
    leg: new THREE.MeshStandardMaterial({
      color: 0x2b2b2b,
      roughness: 0.35,
      metalness: 0.55,
    }),
  };
}

const materials = createMaterials();

// ========== 照明系统 ==========
class LightingController {
  constructor(scene) {
    this.scene = scene;
    this.lights = {};
    this.initializeLights();
  }

  initializeLights() {
    this.lights.ambient = new THREE.HemisphereLight(0xffffff, 0x777777, 2.0);
    this.scene.add(this.lights.ambient);

    this.lights.sun = new THREE.DirectionalLight(0xffffff, 2.2);
    this.lights.sun.position.set(4000, 10000, 3000);
    this.lights.sun.castShadow = true;
    this.lights.sun.shadow.mapSize.set(2048, 2048);
    this.lights.sun.shadow.camera.left = -7000;
    this.lights.sun.shadow.camera.right = 7000;
    this.lights.sun.shadow.camera.top = 7000;
    this.lights.sun.shadow.camera.bottom = -7000;
    this.scene.add(this.lights.sun);
  }

  setLightingScene(sceneName) {
    const scenes = {
      morning: { sunIntensity: 2.0, sunColor: 0xfff8e7, ambientIntensity: 1.2 },
      noon: { sunIntensity: 2.8, sunColor: 0xffffff, ambientIntensity: 1.15 },
      evening: { sunIntensity: 1.8, sunColor: 0xffe4b5, ambientIntensity: 0.95 },
      night: { sunIntensity: 0.3, sunColor: 0x6b7280, ambientIntensity: 0.45 },
    };

    const config = scenes[sceneName] || scenes.noon;
    this.lights.sun.intensity = config.sunIntensity;
    this.lights.sun.color.setHex(config.sunColor);
    this.lights.ambient.intensity = config.ambientIntensity;
  }
}

const lighting = new LightingController(scene);
lighting.setLightingScene('noon');

// ========== 空间参数 ==========
const W = 9850, D = 9450, wallH = 2850, wallT = 180;

// 地板
const floor = new THREE.Mesh(new THREE.BoxGeometry(W, 80, D), materials.floor);
floor.position.set(W / 2, -40, D / 2);
floor.receiveShadow = true;
scene.add(floor);

// 网格辅助线
const grid = new THREE.GridHelper(10000, 20, 0xcfc7b8, 0xe4ddcd);
grid.position.set(W / 2, 1, D / 2);
scene.add(grid);

// ========== 墙体 ==========
function createWall(x, z, w, d) {
  const geometry = new THREE.BoxGeometry(w, wallH, d);
  const mesh = new THREE.Mesh(geometry, materials.wall);
  mesh.position.set(x, wallH / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

createWall(W / 2, 0, W, wallT);
createWall(W / 2, D, W, wallT);
createWall(0, D / 2, wallT, D);
createWall(W, D / 2, wallT, D);
createWall(3000, 2125, wallT, 4250);
createWall(6850, 2125, wallT, 4250);
createWall(3000, 5450, wallT, 2400);

// ========== 家具 ==========
const furniture = [];

function createFurniture(name, x, z, w, d, h, matKey, y = 0) {
  const geometry = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geometry, materials[matKey]);
  mesh.position.set(0, y + h / 2, 0);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  const group = new THREE.Group();
  group.name = name;
  group.position.set(x, 0, z);
  group.add(mesh);
  group.dimensions = { w, d, h };
  scene.add(group);

  furniture.push(group);
  return group;
}

createFurniture('Master bed', 1500, 2350, 1800, 2100, 450, 'fabric');
createFurniture('Living sofa', 8250, 3300, 2900, 900, 800, 'fabric');
createFurniture('Dining table', 8200, 5600, 1500, 1500, 760, 'wood');
createFurniture('Bedroom 2 bed', 4800, 2600, 1500, 2000, 420, 'fabric');
createFurniture('Bedroom 3 bed', 5200, 5900, 1400, 2000, 280, 'fabric');

// ========== 视角控制 ==========
function changeView(viewName) {
  const views = {
    perspective: { pos: [11000, 9000, 11500], target: [4900, 0, 4700] },
    top: { pos: [W / 2, 13500, D / 2], target: [W / 2, 0, D / 2] },
    living: { pos: [10800, 4700, 6000], target: [8200, 0, 5000] },
    master: { pos: [4400, 3800, 6500], target: [1700, 0, 2500] },
  };
  const v = views[viewName] || views.perspective;
  camera.position.set(...v.pos);
  controls.target.set(...v.target);
  controls.update();
}

// ========== 照明控制 ==========
function changeLighting(sceneName) {
  lighting.setLightingScene(sceneName);
}

// ========== 导出功能 ==========
function saveLayout() {
  const data = furniture.map(f => ({
    name: f.name,
    position: { x: Math.round(f.position.x), z: Math.round(f.position.z) },
  }));
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'layout.json';
  a.click();
  URL.revokeObjectURL(url);
}

function screenshot() {
  renderer.render(scene, camera);
  renderer.domElement.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'design.png';
    a.click();
    URL.revokeObjectURL(url);
  });
}

// ========== 性能监控 ==========
const fpsMonitor = (() => {
  let lastTime = Date.now();
  let frames = 0;
  let fps = 0;
  return {
    update() {
      frames++;
      const now = Date.now();
      if (now - lastTime >= 1000) {
        fps = frames;
        frames = 0;
        lastTime = now;
      }
      return fps;
    },
    getFPS: () => fps,
  };
})();

// ========== 动画循环 ==========
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  fpsMonitor.update();
  
  // 更新统计
  document.getElementById('stat-furniture').textContent = furniture.length;
  document.getElementById('stat-collisions').textContent = '0';
  document.getElementById('stat-fps').textContent = fpsMonitor.getFPS();
  
  renderer.render(scene, camera);
}

animate();

// ========== 响应式 ==========
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ========== 隐藏加载屏 ==========
window.addEventListener('load', () => {
  setTimeout(() => {
    const loading = document.getElementById('loading');
    loading.classList.add('hidden');
    setTimeout(() => loading.style.display = 'none', 300);
  }, 500);
});
</script>
</body>
</html>
