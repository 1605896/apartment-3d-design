<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>9850 × 9450 智能装修 3D 设计系统（完整版）</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #eee;
    }
    #canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui {
      position: fixed;
      z-index: 5;
      left: 14px;
      top: 14px;
      width: 320px;
      max-height: calc(100vh - 28px);
      overflow-y: auto;
      background: rgba(255, 255, 255, .96);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .16);
      font-size: 12px;
      line-height: 1.5;
      color: #333;
    }
    #ui h1 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #222;
    }
    #ui h2 {
      font-size: 13px;
      margin: 14px 0 8px;
      color: #555;
      font-weight: 600;
    }
    #ui p {
      margin: 0 0 8px;
      color: #666;
    }
    .note {
      background: #f6f1e8;
      padding: 8px;
      border-radius: 8px;
      margin: 8px 0;
      font-size: 11px;
      line-height: 1.4;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 6px 0;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 6px 10px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 11px;
      flex: 1;
      min-width: 60px;
      transition: all 0.2s;
    }
    button:hover {
      background: #444;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .15);
    }
    button.alt {
      background: #ddd;
      color: #222;
    }
    button.alt:hover {
      background: #ccc;
    }
    select, input[type="text"], input[type="file"] {
      width: 100%;
      padding: 6px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 11px;
      margin: 4px 0;
      box-sizing: border-box;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
      padding: 6px;
      background: #fafafa;
      border-radius: 6px;
      font-size: 11px;
    }
    .item input {
      width: 50px;
      padding: 4px;
      margin: 0;
    }
    #legend span {
      display: inline-block;
      margin: 2px 3px 2px 0;
      padding: 3px 7px;
      border-radius: 6px;
      background: #eee;
      font-size: 10px;
    }
    #legend .living { background: #e8dcc9; }
    #legend .bed { background: #dedbd0; }
    #legend .wet { background: #cbdbea; }
    #loading {
      position: fixed;
      inset: 0;
      background: #f8f6f2;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #888;
      transition: opacity 0.3s;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="loading">
  <div style="text-align: center;">
    <div style="font-size: 24px; margin-bottom: 12px;">🏠</div>
    <div>正在初始化 3D 场景...</div>
    <div style="font-size: 11px; margin-top: 8px; color: #aaa;">加载材质、照明与家具数据</div>
  </div>
</div>

<div id="ui">
  <h1>🏠 3D 装修设计系统</h1>
  <p><b>9850 × 9450 mm 完整版</b></p>
  <div class="note">
    原则：完全保留原格局、门窗和厨房位置；只调整软装家具位置。
  </div>
  <div class="note" style="background: #f0f4ff; margin-top: 8px;">
    <b>✨ 完整版功能：</b>写实材质 + 多场景照明 + 碰撞检测 + 尺寸标注 + 动线分析 + 布局保存
  </div>

  <h2>📺 视角</h2>
  <div class="row">
    <button id="view-3d">3D</button>
    <button id="view-top">俯视</button>
    <button id="view-living">客餐厅</button>
    <button id="view-master">主人房</button>
  </div>

  <h2>💡 照明场景</h2>
  <select id="lighting-scene">
    <option value="morning">☀️ 早晨阳光</option>
    <option value="noon" selected>🌞 正午阳光</option>
    <option value="evening">🌅 傍晚温光</option>
    <option value="night">🌙 夜间灯光</option>
  </select>

  <h2>🛠️ 工具</h2>
  <div class="row">
    <button id="measure-tool">📏 测量</button>
    <button id="flow-tool">🚶 动线</button>
    <button id="collision-toggle">⚠️ 碰撞</button>
  </div>
  <div class="row">
    <button id="save-layout">💾 保存</button>
    <button id="load-layout">📂 加载</button>
    <button id="export-csv">📊 导出</button>
  </div>
  <div class="row">
    <button id="screenshot">📸 截图</button>
    <button id="undo-btn">↶ 撤销</button>
    <button id="redo-btn">↷ 重做</button>
  </div>

  <h2>🏠 家具与设备</h2>
  <div id="legend">
    <span class="living">客餐厅</span>
    <span class="bed">卧室</span>
    <span class="wet">卫浴</span>
  </div>
  <p style="font-size: 11px; color: #999;">可直接拖动家具改变位置</p>
  <div id="objects"></div>

  <h2>📊 实时统计</h2>
  <div id="stats" style="background: #f9f9f9; padding: 8px; border-radius: 6px; font-size: 11px;">
    <div>📦 家具: <span id="stat-furniture">0</span></div>
    <div>⚠️ 碰撞: <span id="stat-collisions">0</span></div>
    <div>📐 使用率: <span id="stat-usage">0</span>%</div>
    <div>⚡ FPS: <span id="stat-fps">60</span></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.161/examples/jsm/controls/OrbitControls.js";
import { createMaterialLibrary } from "./src/core/materials.js";
import { LightingController } from "./src/core/lighting.js";
import { EnhancedDragController } from "./src/interaction/drag.js";
import { HistoryManager } from "./src/interaction/history.js";
import { FURNITURE_DB } from "./src/utils/furniture-db.js";
import { UIPanel } from "./src/ui/panel.js";
import { ExportManager } from "./src/ui/export.js";
import { MeasurementTool, FlowAnalysisTool } from "./src/ui/tools.js";
import { createFPSMonitor } from "./src/utils/helpers.js";

// ========== 初始化场景 ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf8f6f2);
scene.fog = new THREE.Fog(0xf8f6f2, 14000, 30000);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 1, 50000);
camera.position.set(11000, 9000, 11500);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(4900, 0, 4700);
controls.minDistance = 2000;   // prevent zooming inside/through furniture
controls.maxDistance = 22000;  // stay well within fog.far (30000) so the model never fades out
controls.autoRotate = false;

// ========== 材质与照明系统 ==========
const materials = createMaterialLibrary();
const lightingController = new LightingController(scene);
lightingController.setLightingScene("noon");

// ========== 空间参数 ==========
const W = 9850, D = 9450, wallH = 2850, wallT = 180;

// 地板
const floor = new THREE.Mesh(new THREE.BoxGeometry(W, 80, D), materials.floor);
floor.position.set(W / 2, -40, D / 2);
floor.receiveShadow = true;
scene.add(floor);

// 网格辅助线
const grid = new THREE.GridHelper(10000, 20, 0xcfc7b8, 0xe4ddcd);
grid.position.set(W / 2, 1, D / 2);
scene.add(grid);

// ========== 家具系统 ==========
const draggableFurniture = [];

function createFurniture(name, x, z, w, d, h, matKey, y) {
  const geometry = new THREE.BoxGeometry(w, h, d);
  const mesh = new THREE.Mesh(geometry, materials[matKey]);
  mesh.position.set(x, y + h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  const group = new THREE.Group();
  group.name = name;
  group.position.set(x, 0, z);
  group.add(mesh);
  group.dimensions = { w, d, h };
  group.userData = { draggable: true };
  scene.add(group);

  if (materials[matKey]?.map) {
    geometry.scale(w / 100, h / 100, d / 100);
  }

  return group;
}

// 创建家具实例（根据 FURNITURE_DB）
const furnitureInstances = [
  createFurniture("Master bed", 1500, 2350, 1800, 2100, 450, "fabric", 0),
  createFurniture("Living sofa", 8250, 3300, 2900, 900, 800, "fabric", 0),
  createFurniture("Dining table", 8200, 5600, 1500, 1500, 760, "wood", 0),
  createFurniture("Bedroom 2 bed", 4800, 2600, 1500, 2000, 420, "fabric", 0),
  createFurniture("Bedroom 3 bed", 5200, 5900, 1400, 2000, 280, "fabric", 0),
];

furnitureInstances.forEach(f => draggableFurniture.push(f));

// ========== 墙体结构（固定）==========
function createWall(x, z, w, d) {
  const geometry = new THREE.BoxGeometry(w, wallH, d);
  const mesh = new THREE.Mesh(geometry, materials.wall);
  mesh.position.set(x, wallH / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

createWall(W / 2, 0, W, wallT);
createWall(W / 2, D, W, wallT);
createWall(0, D / 2, wallT, D);
createWall(W, D / 2, wallT, D);
createWall(3000, 2125, wallT, 4250);
createWall(6850, 2125, wallT, 4250);
createWall(3000, 5450, wallT, 2400);

// ========== 交互系统 ==========
const dragController = new EnhancedDragController(
  draggableFurniture,
  camera,
  renderer,
  {
    boundaries: { minX: 300, maxX: 9550, minZ: 300, maxZ: 9150 },
    enableCollisionDetection: true,
    enableVisualization: true,
  }
);

const historyManager = new HistoryManager();
historyManager.saveState(draggableFurniture);

const exportManager = new ExportManager(renderer, scene);
const measurementTool = new MeasurementTool(scene, camera);
const flowAnalysisTool = new FlowAnalysisTool(scene);

// ========== UI 系统 ==========
const ui = new UIPanel({ containerSelector: "#ui" });
ui.initialize();

// 事件监听
ui.on("onViewChange", (viewName) => {
  const views = {
    perspective: { pos: [11000, 9000, 11500], target: [4900, 0, 4700] },
    top: { pos: [W / 2, 13500, D / 2], target: [W / 2, 0, D / 2] },
    living: { pos: [10800, 4700, 6000], target: [8200, 0, 5000] },
    master: { pos: [4400, 3800, 6500], target: [1700, 0, 2500] },
  };
  const v = views[viewName] || views.perspective;
  camera.position.set(...v.pos);
  controls.target.set(...v.target);
  controls.update();
});

ui.on("onLightingChange", (sceneName) => {
  lightingController.setLightingScene(sceneName);
});

ui.on("onSaveLayout", () => {
  exportManager.saveLayout(draggableFurniture);
  ui.showNotification("✅ 布局已保存", "success");
});

ui.on("onScreenshot", () => {
  exportManager.screenshot();
  ui.showNotification("📸 截图已保存", "success");
});

ui.on("onUndo", () => {
  if (historyManager.canUndo()) {
    historyManager.undo(draggableFurniture);
    ui.showNotification("↶ 已撤销", "info");
  }
});

ui.on("onRedo", () => {
  if (historyManager.canRedo()) {
    historyManager.redo(draggableFurniture);
    ui.showNotification("↷ 已重做", "info");
  }
});

// ========== 性能监控 ==========
const fpsMonitor = createFPSMonitor();

// ========== 更新UI ==========
function updateUIStats() {
  const collisions = dragController.getCollisionReport();
  document.getElementById("stat-furniture").textContent = draggableFurniture.length;
  document.getElementById("stat-collisions").textContent = collisions.length;
  document.getElementById("stat-usage").textContent = Math.round(
    (draggableFurniture.length * 500 * 500) / (W * D) * 100
  );
  document.getElementById("stat-fps").textContent = fpsMonitor.getFPS();
}

function updateFurnitureList() {
  ui.updateFurnitureList(
    draggableFurniture.map((obj, i) => ({
      name: obj.name,
      position: obj.position,
      category: FURNITURE_DB.bed?.[obj.name]?.category || "other",
    }))
  );
}

updateFurnitureList();

// ========== 动画循环 ==========
function animate() {
  requestAnimationFrame(animate);

  controls.update();
  fpsMonitor.update();
  updateUIStats();

  renderer.render(scene, camera);
}

animate();

// ========== 响应式 ==========
window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ========== 隐藏加载屏 ==========
window.addEventListener("load", () => {
  setTimeout(() => {
    const loading = document.getElementById("loading");
    loading.classList.add("hidden");
    setTimeout(() => loading.style.display = "none", 300);
  }, 500);
});

// 导出全局引用（用于控制台调试）
window.app = {
  scene,
  camera,
  renderer,
  controls,
  dragController,
  historyManager,
  lightingController,
  ui,
  exportManager,
};
</script>
</body>
</html>
